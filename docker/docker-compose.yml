services:
  postgres:
    image: postgres:16.15
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
    # the Typesense binary only accepts these as CLI flags, so we forward the env vars above
    command: '--data-dir=/data --api-key=${TYPESENSE_API_KEY}'
    ports:
      - '${TYPESENSE_PORT}:8108'
    volumes:
      - typesense_data:/data
    healthcheck:
      # image has no curl/wget; CMD-SHELL defaults to /bin/sh (dash), which lacks
      # /dev/tcp, so invoke bash explicitly to hit /health
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"ok\":true' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  typesense_data:
