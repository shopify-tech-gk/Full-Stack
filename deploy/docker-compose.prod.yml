# YouMart production stack - one server (AWS EC2, 8 GB). Run from /opt/youmart:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Only Caddy publishes ports (80/443). Postgres, Redis, Typesense and the services are reachable
# only inside this Docker network. Images come from the CI build (deploy/README.md).

x-backend: &backend
  image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    # ~100 MB per service is normal; cap the heap so one runaway service can't starve the box.
    NODE_OPTIONS: --max-old-space-size=256
  volumes:
    # Every service loads the repo-root .env (process.loadEnvFile) - mount the production one.
    - ./.env:/app/.env:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  # --- data -------------------------------------------------------------------------------------
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=8MB
               -c maintenance_work_mem=128MB -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command: '--data-dir=/data --api-key=${TYPESENSE_API_KEY}'
    volumes:
      - typesense_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"ok\":true' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    logging: *logging

  # --- one-off: database migrations (run by deploy.sh before the services start) ----------------
  migrate:
    <<: *backend
    restart: 'no'
    profiles: ['tools']
    working_dir: /app/packages/db
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']

  # --- backend ----------------------------------------------------------------------------------
  gateway:
    <<: *backend
    command: ['node', 'apps/api-gateway/dist/index.js']
  auth:
    <<: *backend
    command: ['node', 'apps/auth-service/dist/index.js']
  catalog:
    <<: *backend
    command: ['node', 'apps/catalog-service/dist/index.js']
  inventory:
    <<: *backend
    command: ['node', 'apps/inventory-service/dist/index.js']
  cart:
    <<: *backend
    command: ['node', 'apps/cart-service/dist/index.js']
  order:
    <<: *backend
    command: ['node', 'apps/order-service/dist/index.js']
  payment:
    <<: *backend
    command: ['node', 'apps/payment-service/dist/index.js']
  seller:
    <<: *backend
    command: ['node', 'apps/seller-service/dist/index.js']
  settlement:
    <<: *backend
    command: ['node', 'apps/settlement-service/dist/index.js']
  logistics:
    <<: *backend
    command: ['node', 'apps/logistics-service/dist/index.js']
  returns:
    <<: *backend
    command: ['node', 'apps/returns-service/dist/index.js']
  address:
    <<: *backend
    command: ['node', 'apps/address-service/dist/index.js']
  notification:
    <<: *backend
    command: ['node', 'apps/notification-service/dist/index.js']
  search:
    <<: *backend
    command: ['node', 'apps/search-service/dist/index.js']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      typesense: { condition: service_healthy }
  invoice:
    <<: *backend
    command: ['node', 'apps/invoice-service/dist/index.js']
    volumes:
      - ./.env:/app/.env:ro
      - invoice_storage:/app/storage
  admin:
    <<: *backend
    command: ['node', 'apps/admin-service/dist/index.js']

  # --- website + HTTPS --------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side rendering talks to the gateway inside the Docker network.
      API_INTERNAL_URL: http://gateway:4000/api
      NODE_OPTIONS: --max-old-space-size=512
    depends_on: [gateway]
    logging: *logging

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, gateway]
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  invoice_storage:
  caddy_data:
  caddy_config:
