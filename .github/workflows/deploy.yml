# Build the production images and deploy them to the EC2 server.
# Runs only when started by hand (Actions -> "Deploy to production" -> Run workflow), so a push to
# a branch never changes the live site by itself.
#
# Repository settings it needs (deploy/README.md, step 9):
#   Variables: EC2_INSTANCE_ID, SITE_URL (https://youmart.in), AWS_REGION (ap-south-1)
#              optional TARGET_PLATFORM (linux/arm64 for Graviton - default; linux/amd64 for Intel)
#              optional BUILD_RUNNER (ubuntu-24.04-arm default; ubuntu-latest for Intel)
#   Secret:    AWS_DEPLOY_ROLE_ARN (IAM role GitHub may assume via OIDC - no AWS keys stored)
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after building (untick to only build the images)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM: ${{ vars.TARGET_PLATFORM || 'linux/arm64' }}

jobs:
  build:
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deploy/backend.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lower case)
        id: img
        run: echo "repo=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/youmart-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ steps.img.outputs.repo }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.SITE_URL }}/api
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Run deploy.sh on the server (Session Manager)
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "youmart deploy ${{ github.sha }}" \
            --timeout-seconds 1800 \
            --parameters 'commands=["sudo -u ubuntu /opt/youmart/server/deploy.sh ${{ github.sha }}"]' \
            --query 'Command.CommandId' --output text)
          echo "command: $CMD_ID"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 60
          test "$STATUS" = Success
